<!DOCTYPE html>

<html lang="vi">


<head>

<meta charset="UTF-8">

<title>
Quản lý vé
</title>


<style>

body{

font-family:Arial;

padding:20px;

}


h1{

color:#8B4513;

}


input{

padding:10px;

margin:5px;

width:200px;

}



button{

padding:10px 15px;

background:#8B4513;

color:white;

border:none;

cursor:pointer;

}



table{

width:100%;

margin-top:20px;

border-collapse:collapse;

}



th{

background:#d2a679;

}



th,td{

padding:10px;

border:1px solid #999;

text-align:center;

}



.xoa{

background:red;

}



</style>


</head>



<body>



<h1>
🎫 QUẢN LÝ VÉ DU LỊCH
</h1>



<input 
id="loaiVe"
placeholder="Tên loại vé">


<input 
id="giaVe"
placeholder="Giá vé">


<input 
id="soLuong"
placeholder="Số lượng">


<button onclick="themVe()">

➕ Thêm vé

</button>



<h2 id="tong">

Tổng doanh thu: 0 VNĐ

</h2>




<table id="bangVe">


<tr>

<th>
STT
</th>

<th>
Loại vé
</th>

<th>
Giá vé
</th>

<th>
Số lượng
</th>

<th>
Doanh thu
</th>

<th>
Xóa
</th>


</tr>


</table>





<script>


let danhSachVe = JSON.parse(localStorage.getItem("ve")) || [];



hienThiVe();





function themVe(){



let loaiVe =
document.getElementById("loaiVe").value;



let giaVe =
Number(document.getElementById("giaVe").value);



let soLuong =
Number(document.getElementById("soLuong").value);





if(loaiVe=="" || giaVe==0 || soLuong==0){


alert("Vui lòng nhập đầy đủ");


return;


}




let veMoi={


loai:loaiVe,

gia:giaVe,

soLuong:soLuong


};



danhSachVe.push(veMoi);



luuVe();



hienThiVe();



}





function hienThiVe(){



let bang =
document.getElementById("bangVe");



bang.innerHTML=`


<tr>

<th>
STT
</th>


<th>
Loại vé
</th>


<th>
Giá vé
</th>


<th>
Số lượng
</th>


<th>
Doanh thu
</th>


<th>
Xóa
</th>


</tr>



`;



let tong=0;



danhSachVe.forEach(function(ve,index){



let doanhThu =
ve.gia * ve.soLuong;



tong += doanhThu;



bang.innerHTML += `


<tr>


<td>
${index+1}
</td>


<td>
${ve.loai}
</td>


<td>
${ve.gia.toLocaleString()}
</td>


<td>
${ve.soLuong}
</td>


<td>
${doanhThu.toLocaleString()}
</td>


<td>


<button class="xoa"

onclick="xoaVe(${index})">

Xóa

</button>


</td>


</tr>


`;



});



document.getElementById("tong").innerHTML =

"Tổng doanh thu: "
+
tong.toLocaleString()
+
" VNĐ";



}





function xoaVe(index){



danhSachVe.splice(index,1);



luuVe();



hienThiVe();



}





function luuVe(){



localStorage.setItem(

"ve",

JSON.stringify(danhSachVe)

);



}



</script>



</body>


</html>
