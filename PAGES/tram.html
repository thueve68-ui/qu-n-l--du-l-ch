<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<title>
Quản lý trạm tham quan
</title>


<style>


body{

font-family:Arial;

padding:20px;

}



h1{

color:#8B4513;

}



input, textarea{

padding:10px;

margin:5px;

width:250px;

}



textarea{

height:80px;

}



button{

padding:10px 15px;

background:#8B4513;

color:white;

border:none;

cursor:pointer;

}



table{

width:100%;

margin-top:20px;

border-collapse:collapse;

}



th{

background:#d2a679;

}



th,td{

padding:10px;

border:1px solid #999;

text-align:center;

}



.xoa{

background:red;

}


</style>


</head>



<body>



<h1>
📍 QUẢN LÝ TRẠM THAM QUAN
</h1>



<input 
id="tenTram"
placeholder="Tên trạm">



<input 
id="viTri"
placeholder="Vị trí">



<br>


<textarea 
id="moTa"
placeholder="Mô tả trạm">
</textarea>



<br>


<button onclick="themTram()">

➕ Thêm trạm

</button>




<table id="bangTram">


<tr>

<th>
STT
</th>


<th>
Tên trạm
</th>


<th>
Vị trí
</th>


<th>
Mô tả
</th>


<th>
Xóa
</th>


</tr>


</table>





<script>


let danhSachTram =

JSON.parse(localStorage.getItem("tram")) || [];



hienThiTram();





function themTram(){



let ten =

document.getElementById("tenTram").value;



let viTri =

document.getElementById("viTri").value;



let moTa =

document.getElementById("moTa").value;




if(ten=="" || viTri==""){


alert("Vui lòng nhập đủ thông tin");


return;


}



let tramMoi = {


ten:ten,

viTri:viTri,

moTa:moTa


};



danhSachTram.push(tramMoi);



luuTram();



hienThiTram();



}





function hienThiTram(){



let bang =

document.getElementById("bangTram");



bang.innerHTML=`


<tr>

<th>
STT
</th>


<th>
Tên trạm
</th>


<th>
Vị trí
</th>


<th>
Mô tả
</th>


<th>
Xóa
</th>


</tr>


`;




danhSachTram.forEach(function(tram,index){



bang.innerHTML += `


<tr>


<td>

${index+1}

</td>


<td>

${tram.ten}

</td>


<td>

${tram.viTri}

</td>


<td>

${tram.moTa}

</td>


<td>


<button class="xoa"

onclick="xoaTram(${index})">

Xóa

</button>


</td>


</tr>


`;



});



}





function xoaTram(index){


danhSachTram.splice(index,1);



luuTram();



hienThiTram();


}





function luuTram(){


localStorage.setItem(

"tram",

JSON.stringify(danhSachTram)

);


}



</script>


</body>


</html>
