<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<title>
Bản đồ du lịch
</title>


<style>

body{

font-family:Arial;

padding:20px;

}


h1{

color:#8B4513;

}



/* KHUNG BẢN ĐỒ */

#banDo{

width:600px;

height:300px;

background-image:url("../images/matbang.png");

background-size:cover;

background-position:center;

position:relative;

border:2px solid #8B4513;

}





/* ĐIỂM TRẠM */

.tram{

position:absolute;

width:40px;

height:40px;

background:#b22222;

border-radius:50%;

color:white;

text-align:center;

line-height:40px;

cursor:pointer;

font-weight:bold;

}





/* BẢNG THÔNG TIN */

.thongtin{

display:none;

position:absolute;

top:550px;

left:50%;

transform:translateX(-50%);

background:white;

padding:20px;

border:2px solid #8B4513;

border-radius:10px;

width:300px;

text-align:center;

box-shadow:0 5px 15px rgba(0,0,0,0.2);

}



</style>


</head>



<body>



<h1>
🗺 BẢN ĐỒ DU LỊCH LÀNG GỐM MANG THÍT
</h1>




<div id="banDo">





<!-- TRẠM 1 -->

<div

class="tram"

style="top:80px;left:150px"

onclick="hienThi(

'Lò gốm cổ',

'Không gian sản xuất gốm truyền thống'

)">

1

</div>





<!-- TRẠM 2 -->


<div

class="tram"

style="top:120px;left:400px"

onclick="hienThi(

'Xưởng nghệ nhân',

'Trải nghiệm làm gốm cùng nghệ nhân'

)">

2

</div>





<!-- TRẠM 3 -->


<div

class="tram"

style="top:300px;left:200px"

onclick="hienThi(

'Bến tàu du lịch',

'Điểm xuất phát tour đường thủy'

)">

3

</div>






<!-- BẢNG THÔNG TIN -->


<div id="info" class="thongtin">


</div>



</div>






<script>


function hienThi(ten,mota){


let box=document.getElementById("info");



box.style.display="block";



box.innerHTML=


`

<h3>${ten}</h3>

<p>${mota}</p>


`;



}



</script>



</body>


</html>
